# Local WordPress for trying the plugin:
#   docker compose -f dev/docker-compose.yml up -d
#   open http://localhost:8088 and finish the WordPress installer (or use the cli service).
# dev/mock-connect.php is a stand-in for MomoBird's connect API:
#   docker compose -f dev/docker-compose.yml exec -d wordpress php -S 127.0.0.1:8099 /var/www/html/wp-content/plugins/momobird-ai/dev/mock-connect.php
# then set the plugin's Base URL to http://127.0.0.1:8099.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: wordpress
    volumes:
      - db:/var/lib/mysql
  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      - db
    ports:
      - "8088:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/momobird-ai
  cli:
    image: wordpress:cli-php8.2
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/momobird-ai
volumes:
  db:
  wp:
